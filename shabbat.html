<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>שבת שלום | פלאש פלוס</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#213d5e,transparent 65%),#081426;color:#fff;font-family:Arial,sans-serif;text-align:center}main{padding:40px 24px;max-width:600px}.brand{font-size:38px;font-weight:900}.brand span,.time{color:#f8c453}.line{width:52px;height:3px;background:#f8c453;margin:32px auto}h1{font-size:clamp(40px,7vw,64px)}p{font-size:23px;line-height:1.8}.note{color:#a9b8cd;font-size:16px}a{display:inline-block;background:#f8c453;color:#081426;padding:14px 24px;text-decoration:none;border-radius:10px;font-weight:bold}a[hidden]{display:none}</style><script src="shabbat-clock.js"></script></head><body><main><div class="brand">פלאש <span>פלוס</span></div><div class="line"></div><h1 id="title">שבת שלום!</h1><p id="message">האתר סגור בשבת וייפתח שוב במוצאי שבת.</p><p id="time" class="time"></p><p class="note">נשמח לעמוד לשירותכם לאחר צאת השבת</p><a id="return" href="https://www.flashplus.co.il/" hidden>חזרה לאתר</a></main><script>(function(){function update(){var s=FlashPlusShabbat.state();document.getElementById('title').textContent=s.closed?'שבת שלום!':'שבוע טוב!';document.getElementById('message').textContent=s.closed?'האתר סגור בשבת וייפתח שוב במוצאי שבת.':'האתר פתוח כעת. נשמח לעמוד לשירותכם.';document.getElementById('time').textContent=s.closed?'פתיחה מחדש: '+new Intl.DateTimeFormat('he-IL',{timeZone:'Asia/Jerusalem',weekday:'long',hour:'2-digit',minute:'2-digit'}).format(new Date(s.end)):'';document.getElementById('return').hidden=s.closed;setTimeout(update,30000)}update()})();</script></body></html>
